<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Game - Knowledge Challenge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Start screen -->
        <div id="startScreen" class="screen active">
            <div class="start-content">
                <h1 class="title">🎯 Quiz Game</h1>
                <p class="subtitle">4 categories, 40 challenging questions</p>
                <div class="categories-preview">
                    <div class="category-chip">🏛️ History</div>
                    <div class="category-chip">🌍 World Geography</div>
                    <div class="category-chip">🔬 Science</div>
                    <div class="category-chip">🎨 Arts & Culture</div>
                </div>
                <button id="startBtn" class="btn btn-primary">Start Game</button>
            </div>
        </div>

        <!-- Quiz screen -->
        <div id="quizScreen" class="screen">
            <div class="quiz-header">
                <div class="progress-info">
                    <span id="currentQuestion">1</span> / <span id="totalQuestions">40</span>
                </div>
                <div class="score-info">
                    Score: <span id="currentScore">0</span>
                </div>
            </div>

            <div class="progress-bar">
                <div id="progressFill" class="progress-fill"></div>
            </div>

            <div class="quiz-content">
                <div class="category-badge" id="categoryBadge">History</div>
                <h2 id="questionText" class="question">The question will appear here</h2>

                <div id="optionsContainer" class="options-container">
                    <!-- Options are generated dynamically -->
                </div>
            </div>

            <!-- Feedback modal -->
            <div id="feedbackModal" class="feedback-modal">
                <div class="feedback-content">
                    <div id="feedbackIcon" class="feedback-icon"></div>
                    <h3 id="feedbackTitle">Correct!</h3>
                    <p id="feedbackExplanation">The explanation will appear here</p>
                    <button id="nextBtn" class="btn btn-secondary">Next Question</button>
                </div>
            </div>
        </div>

        <!-- Result screen -->
        <div id="resultScreen" class="screen">
            <div class="result-content">
                <h1 class="result-title">🏆 Quiz Complete!</h1>

                <div class="result-stats">
                    <div class="stat-card">
                        <div class="stat-value" id="finalScore">0</div>
                        <div class="stat-label">Final Score</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="correctCount">0</div>
                        <div class="stat-label">Correct Answers</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="accuracyRate">0%</div>
                        <div class="stat-label">Accuracy</div>
                    </div>
                </div>

                <div class="category-results" id="categoryResults">
                    <!-- Per-category results are generated dynamically -->
                </div>

                <div class="result-actions">
                    <button id="restartBtn" class="btn btn-primary">Restart</button>
                </div>
            </div>
        </div>
    </div>

    <script src="questions.js"></script>
    <script src="script.js"></script>
</body>
</html>
